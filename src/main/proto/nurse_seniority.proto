syntax = "proto3";

package careround.user;

option java_package = "com.dayo.careround.userservice.grpc";
option java_multiple_files = true;

service NurseSeniorityService {
  rpc GetMostSeniorNurse (SeniorityRequest) returns (SeniorityResponse);
}

message NurseCandidate {
  string nurse_id = 1;
  int64 clock_in_epoch_seconds = 2;
}

message SeniorityRequest {
  repeated NurseCandidate candidates = 1;
}

message SeniorityResponse {
  string nurse_id = 1;
}